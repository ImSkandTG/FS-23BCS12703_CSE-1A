<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Card</title>
  <style>
    :root{
      --card-width:320px;
      --radius:12px;
      --shadow:0 6px 18px rgba(16,24,40,0.08);
      --shadow-hover:0 14px 30px rgba(16,24,40,0.14);
      --bg:#f8fafc;
      --accent:#111827;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background:var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .product-card{
      width:var(--card-width);
      background:#fff;
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      transition:transform .22s cubic-bezier(.2,.9,.2,1), box-shadow .22s;
      cursor:pointer;
      display:flex;
      flex-direction:column;
      text-decoration:none;
      color:inherit;
    }
    .product-card:focus,
    .product-card:hover{
      transform:translateY(-6px) scale(1.03);
      box-shadow:var(--shadow-hover);
      outline: none;
    }

    .product-media{
      height:220px; /* fixed media area; image will letterbox to stay fully visible */
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px;
      background:linear-gradient(180deg,#f3f4f6,#ffffff);
    }
    .product-media img{
      max-width:100%;
      max-height:100%;
      object-fit:contain; /* ensures entire image is visible */
      display:block;
      transition:transform .32s ease;
    }
    .product-card:hover .product-media img,
    .product-card:focus .product-media img{
      transform:scale(1.02);
    }

    .product-info{padding:16px}
    .product-name{margin:0;font-size:1rem;font-weight:600;color:var(--accent)}
    .product-price{margin-top:8px;font-weight:700;color:#0f172a;font-size:1.05rem}

    @media (max-width:360px){
      .product-card{width:92vw}
    }
  </style>
</head>
<body>
  <article class="product-card" tabindex="0" aria-label="Product card">
    <div class="product-media">
      <img
        src="https://classyleatherbags.com/cdn/shop/collections/81wWgc4TpKL._UL1500_88ba3fdf-936c-4bb4-9a1b-35d2b41e62b9_1350x1350.jpg?v=1683778031"
        alt="Classic leather bag"
      />
    </div>

    <div class="product-info">
      <h3 class="product-name">Classic Leather Bag</h3>
      <div class="product-price">$129.00</div>
    </div>
  </article>
</body>
</html>
